name: CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  quality-security-build:
    runs-on: [self-hosted, Linux, X64, kind, devops]

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/challenge-devops
      IMAGE_TAG: ${{ github.sha }}
      TRIVY_SEVERITY: HIGH,CRITICAL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff==0.12.0 black==25.1.0 isort==5.13.0 pytest

      - name: Ruff
        run: |
          . .venv/bin/activate
          ruff check app app/tests

      - name: Black
        run: |
          . .venv/bin/activate
          black --check app app/tests

      - name: Isort
        run: |
          . .venv/bin/activate
          isort --check-only app app/tests

      - name: Validate imports
        run: |
          . .venv/bin/activate
          python -c "from app.main import app"

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -x -q

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: 0

      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: 0

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output: trivy-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-artifacts
          path: |
            trivy-results.sarif
            trivy-sbom.spdx.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif