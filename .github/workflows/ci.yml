# ──────────────────────────────────────────────────────────
# CI Pipeline — Build Once, Promote Many
# ──────────────────────────────────────────────────────────
# Estratégia:
#   - Push em develop: validações + build da imagem única
#     (versionada por SHA) + scan + assinatura
#   - Pull Request para main: apenas validações de código
#     (Ruff, Black, Isort, Pytest) + scan de segurança
#     no filesystem (sem build de imagem)
#   - Merge para main: NÃO gera nova imagem
#   - HML/PROD: promovem exatamente a mesma SHA aprovada
# ──────────────────────────────────────────────────────────
name: CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  quality-security-build:
    runs-on: [self-hosted, Windows, X64, kind, devops]

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/challenge-devops
      IMAGE_TAG: ${{ github.sha }}
      TRIVY_SEVERITY: HIGH,CRITICAL
      # Fix para erro UV_HANDLE_CLOSING no Windows
      UV_NO_CACHE: "1"
      UV_CONCURRENT_DOWNLOADS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup UV (Python Package Manager) ──────────────
      - name: Install UV
        run: |
          # Limpar cache antigo do uv se existir
          if (Test-Path "$env:USERPROFILE\.cache\uv") {
            Remove-Item -Recurse -Force "$env:USERPROFILE\.cache\uv" -ErrorAction SilentlyContinue
          }
          # Instalar uv via script oficial
          Invoke-WebRequest -Uri "https://astral.sh/uv/install.ps1" -UseBasicParsing | Invoke-Expression
          # Adicionar ao PATH
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          uv --version

      # ── Code Quality & Testing ─────────────────────────
      # Executa em push e pull request
      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies with UV
        run: |
          uv pip install -r app/requirements.txt
          uv pip install ruff==0.12.0 black==25.1.0 isort==5.13.0

      - name: Ruff
        run: uv run ruff check app app/tests

      - name: Black
        run: uv run black --check app app/tests

      - name: Isort
        run: uv run isort --check-only app app/tests

      - name: Validate imports
        run: uv run python -c "from app.main import app"

      - name: Run tests
        run: uv run pytest -x -q

      # ── Docker Build & Security (Push to develop) ──────
      # Build da imagem única, scan, SBOM e assinatura.
      # Executa APENAS em push para develop — não em PR.
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Security Artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-info
          path: |
            build-metadata.json
