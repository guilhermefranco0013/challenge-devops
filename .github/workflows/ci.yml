# ──────────────────────────────────────────────────────────
# CI Pipeline — Build Once, Promote Many
# ──────────────────────────────────────────────────────────
# Estratégia:
#   - Push em develop: validações + build da imagem única
#     (versionada por SHA) + scan + assinatura
#   - Pull Request para main: apenas validações de código
#     (Ruff, Black, Isort, Pytest) + scan de segurança
#     no filesystem (sem build de imagem)
#   - Merge para main: NÃO gera nova imagem
#   - HML/PROD: promovem exatamente a mesma SHA aprovada
# ──────────────────────────────────────────────────────────
name: CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  quality-security-build:
    runs-on: [self-hosted, Windows, X64, kind, devops]

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/challenge-devops
      IMAGE_TAG: ${{ github.sha }}
      TRIVY_SEVERITY: HIGH,CRITICAL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup UV (Python Package Manager) ──────────────
      - name: Setup UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      # ── Code Quality & Testing ─────────────────────────
      # Executa em push e pull request
      - name: Install dependencies with UV
        run: |
          uv sync
          uv pip install ruff==0.12.0 black==25.1.0 isort==5.13.0

      - name: Ruff
        run: uv run ruff check app app/tests

      - name: Black
        run: uv run black --check app app/tests

      - name: Isort
        run: uv run isort --check-only app app/tests

      - name: Validate imports
        run: uv run python -c "from app.main import app"

      - name: Run tests
        run: uv run pytest -x -q

      # ── Trivy Filesystem (Pull Request) ────────────────
      # Escaneia o código fonte para expor vulnerabilidades
      # durante a revisão sem construir imagem Docker
      - name: Trivy Filesystem Scan (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: 0

      - name: Upload Trivy FS SARIF (PR)
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif

      # ── Docker Build & Security (Push to develop) ──────
      # Build da imagem única, scan, SBOM e assinatura.
      # Executa APENAS em push para develop — não em PR.
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image Scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: 0

      - name: Trivy SARIF
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: 0

      - name: Generate SBOM
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output: trivy-sbom.spdx.json

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name == 'push'
        run: |
          cosign sign --yes \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Security Artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-artifacts
          path: |
            trivy-results.sarif
            trivy-sbom.spdx.json

      - name: Upload SARIF
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
