name: CD HML

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag approved from DEV"
        required: true

concurrency:
  group: cd-hml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  deploy-hml:
    runs-on: [self-hosted, Linux, X64, kind, devops]

    environment: hml

    env:
      NAMESPACE: hml
      RELEASE_NAME: challenge-devops-hml

      VALUES_BASE_FILE: deploy/helm/challenge-devops/values.yaml
      VALUES_ENV_FILE: deploy/helm/challenge-devops/values-hml.yaml

      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/challenge-devops
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint deploy/helm/challenge-devops \
            -f ${{ env.VALUES_BASE_FILE }} \
            -f ${{ env.VALUES_ENV_FILE }}

      - name: Helm Template Validation
        run: |
          helm template ${{ env.RELEASE_NAME }} deploy/helm/challenge-devops \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.VALUES_BASE_FILE }} \
            -f ${{ env.VALUES_ENV_FILE }}

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Cluster Access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name:  Verify image exists
        run: |
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > /dev/null

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Image Signature
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/.+" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy Application
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} deploy/helm/challenge-devops \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ${{ env.VALUES_BASE_FILE }} \
            -f ${{ env.VALUES_ENV_FILE }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set image.pullPolicy=Always \
            --wait \
            --timeout 15m

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/${{ env.RELEASE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Show deployment status
        run: |
          kubectl get deployment -n ${{ env.NAMESPACE }}
          kubectl get pods -o wide -n ${{ env.NAMESPACE }}

      - name: Health Check
        run: |
          kubectl port-forward svc/${{ env.RELEASE_NAME }}-service \
            18081:80 \
            -n ${{ env.NAMESPACE }} > /tmp/pf.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health; then
              exit 0
            fi
            sleep 5
          done

          exit 1

      - name: Deployment summary
        run: |
          echo "Environment: HML"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"