name: CD DEV

"on":
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  deploy-dev:
    runs-on: [self-hosted, Linux, X64, kind, devops]
    environment: dev

    env:
      NAMESPACE: dev
      RELEASE_NAME: challenge-devops-dev
      VALUES_BASE_FILE: deploy/helm/challenge-devops/values.yaml
      VALUES_ENV_FILE: deploy/helm/challenge-devops/values-dev.yaml
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/challenge-devops
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint deploy/helm/challenge-devops \
            --values ${{ env.VALUES_BASE_FILE }} \
            --values ${{ env.VALUES_ENV_FILE }}

      - name: Helm template validation
        run: |
          helm template ${{ env.RELEASE_NAME }} deploy/helm/challenge-devops \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.VALUES_BASE_FILE }} \
            --values ${{ env.VALUES_ENV_FILE }} > rendered-dev.yaml

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify cluster access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Helm upgrade --install
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} deploy/helm/challenge-devops \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values ${{ env.VALUES_BASE_FILE }} \
            --values ${{ env.VALUES_ENV_FILE }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set image.pullPolicy=Always \
            --wait --timeout 10m --atomic

      - name: Wait for rollout availability
        run: |
          kubectl wait --for=condition=Available deployment/${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Validate pods and service
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "---"
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Health check via port-forward
        run: |
          kubectl port-forward svc/${{ env.RELEASE_NAME }}-service 18080:80 -n ${{ env.NAMESPACE }} > /tmp/pf-dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Display deployment summary
        run: |
          echo "App URL: http://dev.challenge.local/health"
          echo "Grafana: http://grafana.challenge.local"
          echo "Prometheus: http://prometheus.challenge.local"
          echo "Tempo: http://tempo.challenge.local"
          echo "Deployed image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
