name: CD DEV

on:
  push:
    branches:
      - develop

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  deploy-dev:
    runs-on: [self-hosted, Windows, X64, kind, devops]

    environment: dev

    env:
      NAMESPACE: dev
      RELEASE_NAME: challenge-devops-dev

      VALUES_BASE_FILE: deploy/helm/challenge-devops/values.yaml
      VALUES_ENV_FILE: deploy/helm/challenge-devops/values-dev.yaml

      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/challenge-devops
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint deploy/helm/challenge-devops \
            -f ${{ env.VALUES_BASE_FILE }} \
            -f ${{ env.VALUES_ENV_FILE }}

      - name: Helm Template Validation
        run: |
          helm template ${{ env.RELEASE_NAME }} deploy/helm/challenge-devops \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.VALUES_BASE_FILE }} \
            -f ${{ env.VALUES_ENV_FILE }}

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Cluster Access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Image Signature
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/.+" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy Application
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} deploy/helm/challenge-devops \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ${{ env.VALUES_BASE_FILE }} \
            -f ${{ env.VALUES_ENV_FILE }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set image.pullPolicy=Always \
            --wait \
            --timeout 15m

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/${{ env.RELEASE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Validate Pods
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Health Check
        run: |
          kubectl port-forward svc/${{ env.RELEASE_NAME }}-service `
            18080:80 `
            -n ${{ env.NAMESPACE }} > $env:TEMP\pf.log 2>&1 &

          for ($i = 1; $i -le 30; $i++) {
            if (curl -fsS http://127.0.0.1:18080/health) {
              echo "Health check passed"
              exit 0
            }
            Start-Sleep -Seconds 5
          }

          echo "Health check failed"
          exit 1

      - name: Deployment Summary
        run: |
          echo "Environment: DEV"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          kubectl rollout history deployment/${RELEASE_NAME} -n ${NAMESPACE}