apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{.Release.Name}}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{.Release.Name}}

  template:

    metadata:
      labels:
        app: {{.Release.Name}}

    spec:

      nodeSelector:
        role: platform-app

      containers:

        - name: {{.Release.Name}}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          envFrom:
            - configMapRef:
                name: challenge-devops-config

            - secretRef:
                name: challenge-devops-secret

          env:

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}

            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}

            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.otel.environment | quote }}

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.containerPort }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}