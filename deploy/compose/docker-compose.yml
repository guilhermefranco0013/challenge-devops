services:

  app:

    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile

    container_name: challenge-devops

    ports:
      - "8000:8000"

    env_file:
      - ../../.env

    restart: always

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3